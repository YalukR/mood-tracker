<div class="flex flex-col gap-6">

  <app-pet></app-pet>

  <div class="text-center pt-4">
    <h1 class="text-xl font-bold text-main dark:text-main-dark">
      {{ greeting() }}
    </h1>
    <br>
    <p class="mx-auto mt-2 flex max-w-xs items-start justify-center gap-1.5 text-xs leading-relaxed
              text-muted dark:text-muted-dark">
      <i class="pi pi-sparkles mt-0.5 flex-shrink-0 text-[10px]"></i>
      <span>{{ curiosityFact() }}</span>
    </p>
  </div>

  <div class="flex-1"></div>

  <a routerLink="/register"
    class="block rounded-2xl bg-blue py-4 text-center text-base font-semibold text-white shadow-sm
           dark:bg-blue-dark dark:text-surface-white-dark">
    Registrar cómo me siento
  </a>

</div>
