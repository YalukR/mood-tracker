<div class="flex flex-col gap-6">

  @if (!showForm()) {
    <!-- Aquí vivirá la mascota más adelante -->
    <div class="flex flex-col items-center justify-center gap-4 py-10">
      <p class="text-sm text-muted dark:text-muted-dark">
        (Espacio reservado para la mascota)
      </p>
    </div>

    <button
      type="button"
      class="rounded-2xl bg-blue py-4 text-base font-semibold text-white shadow-sm
             dark:bg-blue-dark dark:text-surface-white-dark"
      (click)="openForm()">
      Registrar cómo me siento
    </button>
  } @else {
    <app-mood-form
      (saved)="onSaved()"
      (cancelled)="onCancelled()" />
  }

</div>
