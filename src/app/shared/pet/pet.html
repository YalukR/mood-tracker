<div class="sky" [class.sky--visible]="!loading()">

  @for (star of stars(); track star.id) {
  <span class="star star--enter" [style.left.%]="star.x" [style.top.%]="star.y" [style.width.px]="star.size"
    [style.height.px]="star.size" [style.background]="star.color" [style.box-shadow]="'0 0 4px ' + star.color"
    [style.opacity]="star.opacity" [style.animation-delay.s]="star.delay"
    [style.--star-enter-delay]="star.enterDelay + 'ms'">
  </span>
  }

  <div class="sun sun--enter" [style.background]="sunColor()" [style.--sun-glow]="sunColor()"></div>

</div>
