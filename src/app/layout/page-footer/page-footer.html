<nav
  class="fixed bottom-4 left-4 right-4 z-50 flex items-center justify-around
         rounded-[24px] border border-border bg-surface-white/90 px-2 py-1.5
         shadow-[0_8px_30px_-8px_rgba(54,47,42,0.25)] backdrop-blur-md
         [padding-bottom:calc(0.375rem+env(safe-area-inset-bottom))]
         dark:border-border-dark dark:bg-surface-white-dark/90
         dark:shadow-[0_8px_30px_-8px_rgba(0,0,0,0.5)]">

  <app-sliding-indicator
    [count]="items.length"
    [activeIndex]="activeIndex()"
    shapeClass="h-7 w-7 rounded-full bg-blue-soft dark:bg-blue-soft-dark" />

  @for (item of items; track item.path) {
    
      <a class="relative z-10 flex flex-1 flex-col items-center gap-0.5 rounded-2xl
             px-2 py-1 text-muted transition-colors duration-300 ease-out
             dark:text-muted-dark"
      [class.text-blue]="active() === item.path"
      [class.dark:text-blue-dark]="active() === item.path"
      [routerLink]="item.path"
      [attr.aria-label]="item.label">

      <span class="flex h-7 w-7 items-center justify-center">
        <i [class]="'pi ' + item.icon + ' text-base'"></i>
      </span>

      <span
        class="text-[11px] font-medium transition-opacity duration-300"
        [class.opacity-100]="active() === item.path"
        [class.opacity-70]="active() !== item.path">
        {{ item.label }}
      </span>
    </a>
  }
</nav>
