<div class="flex min-h-[80vh] flex-col items-center justify-center gap-8 px-6">

  <div class="flex flex-col items-center gap-3 text-center">
    <div class="flex h-14 w-14 items-center justify-center rounded-full bg-surface-alt dark:bg-surface-alt-dark">
      <i class="pi pi-lock text-xl text-main dark:text-main-dark"></i>
    </div>
    <div>
      <h1 class="text-xl font-bold text-main dark:text-main-dark">Bienvenido de vuelta</h1>
      <p class="mt-1 text-sm text-muted dark:text-muted-dark">Ingresa tu contraseña para continuar</p>
    </div>
  </div>

  <div
    class="flex w-full max-w-xs flex-col gap-3"
    [class.animate-shake]="shake()"
    (animationend)="onShakeEnd()">

    <input type="password"
      class="w-full rounded-xl border px-3 py-2.5 text-center text-sm text-main outline-none transition-colors
             bg-surface-white dark:bg-surface-white-dark dark:text-main-dark"
      [class.border-border]="!error()"
      [class.dark:border-border-dark]="!error()"
      [class.border-danger]="!!error()"
      [class.dark:border-danger-dark]="!!error()"
      [ngModel]="password()"
      (ngModelChange)="password.set($event); error.set(null)"
      (keyup.enter)="unlock()"
      autofocus />

    @if (error()) {
      <p class="text-center text-xs text-danger dark:text-danger-dark">{{ error() }}</p>
    }

    <button type="button"
      class="rounded-2xl bg-blue py-3 text-sm font-semibold text-white transition-opacity
             disabled:opacity-50 dark:bg-blue-dark dark:text-surface-white-dark"
      [disabled]="checking() || !password()"
      (click)="unlock()">
      @if (checking()) {
        <i class="pi pi-spin pi-spinner"></i>
      } @else {
        Entrar
      }
    </button>
  </div>

</div>
